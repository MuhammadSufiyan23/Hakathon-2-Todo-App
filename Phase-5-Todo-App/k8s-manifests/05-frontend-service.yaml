apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: default
  labels:
    app: todo-app
    component: frontend
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 30300
  selector:
    app: todo-app
    component: frontend
