openapi: 3.0.3
info:
  title: Advanced Task Management API
  description: |
    API specification for Phase III-IV advanced task management features.
    Extends existing task endpoints with priorities, tags, search, filter, sort,
    due dates, reminders, recurring tasks, and activity logging.
  version: 2.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:8000/v1
    description: Development server

security:
  - BearerAuth: []

tags:
  - name: Tasks
    description: Task management operations
  - name: Tags
    description: Tag management operations
  - name: Reminders
    description: Reminder management operations
  - name: Activity
    description: Activity log operations

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: List tasks with advanced filtering
      description: |
        Retrieve tasks for the authenticated user with support for search,
        filtering, sorting, and pagination.
      operationId: listTasks
      parameters:
        - name: search
          in: query
          description: Search term for title and description (case-insensitive)
          schema:
            type: string
            example: "meeting"
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: string
            enum: [low, medium, high]
        - name: completed
          in: query
          description: Filter by completion status
          schema:
            type: boolean
        - name: tag
          in: query
          description: Filter by tag name (can be repeated for multiple tags)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: due_date_from
          in: query
          description: Filter tasks with due date on or after this date
          schema:
            type: string
            format: date-time
        - name: due_date_to
          in: query
          description: Filter tasks with due date on or before this date
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [created_at, due_date, priority, updated_at]
            default: created_at
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                    description: Total number of tasks matching filters
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Tasks
      summary: Create a new task
      description: Create a new task with optional priority, tags, due date, and recurrence
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{task_id}:
    get:
      tags:
        - Tasks
      summary: Get task by ID
      description: Retrieve a specific task with all its details
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Tasks
      summary: Update task
      description: Update an existing task (full update)
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Delete a task and all associated data (tags, reminders, activity logs)
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{task_id}/complete:
    post:
      tags:
        - Tasks
      summary: Mark task as complete
      description: |
        Mark a task as complete. If the task is recurring, automatically creates
        the next instance with the calculated due date.
      operationId: completeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed_task:
                    $ref: '#/components/schemas/Task'
                  next_instance:
                    $ref: '#/components/schemas/Task'
                    nullable: true
                    description: Next recurring instance (if task is recurring)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{task_id}/activity:
    get:
      tags:
        - Activity
      summary: Get task activity history
      description: Retrieve all activity log entries for a specific task
      operationId: getTaskActivity
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tags:
    get:
      tags:
        - Tags
      summary: List all tags
      description: Retrieve all tags for the authenticated user
      operationId: listTags
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Tags
      summary: Create a new tag
      description: Create a new tag for the authenticated user
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Tag name already exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tags/{tag_id}:
    get:
      tags:
        - Tags
      summary: Get tag by ID
      description: Retrieve a specific tag
      operationId: getTag
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Tags
      summary: Update tag
      description: Update an existing tag (name or color)
      operationId: updateTag
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        '200':
          description: Tag updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tag name already exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tags
      summary: Delete tag
      description: Delete a tag (removes from all tasks)
      operationId: deleteTag
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '204':
          description: Tag deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reminders:
    get:
      tags:
        - Reminders
      summary: List all reminders
      description: Retrieve all reminders for the authenticated user
      operationId: listReminders
      parameters:
        - name: status
          in: query
          description: Filter by reminder status
          schema:
            type: string
            enum: [pending, sent, failed]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Reminders
      summary: Create a reminder
      description: Create a reminder for a task
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreate'
      responses:
        '201':
          description: Reminder created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reminders/{reminder_id}:
    delete:
      tags:
        - Reminders
      summary: Delete reminder
      description: Delete a reminder
      operationId: deleteReminder
      parameters:
        - $ref: '#/components/parameters/ReminderId'
      responses:
        '204':
          description: Reminder deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /activity:
    get:
      tags:
        - Activity
      summary: Get user activity history
      description: Retrieve all activity log entries for the authenticated user
      operationId: getUserActivity
      parameters:
        - name: action
          in: query
          description: Filter by action type
          schema:
            type: string
            enum: [task_created, task_updated, task_completed, task_deleted, tag_added, tag_removed, reminder_set, reminder_sent]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Better Auth

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID
      schema:
        type: integer
        example: 123

    TagId:
      name: tag_id
      in: path
      required: true
      description: Tag ID
      schema:
        type: integer
        example: 456

    ReminderId:
      name: reminder_id
      in: path
      required: true
      description: Reminder ID
      schema:
        type: integer
        example: 789

  schemas:
    Task:
      type: object
      required:
        - id
        - user_id
        - title
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 123
        user_id:
          type: string
          example: "user_abc123"
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Complete project documentation"
        description:
          type: string
          nullable: true
          maxLength: 5000
          example: "Write comprehensive API documentation for the new features"
        completed:
          type: boolean
          example: false
        priority:
          type: string
          enum: [low, medium, high]
          nullable: true
          example: "high"
        due_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-15T10:00:00Z"
        is_recurring:
          type: boolean
          example: false
        recurrence_rule:
          type: string
          enum: [daily, weekly, monthly]
          nullable: true
          example: "weekly"
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-02-09T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-02-09T08:30:00Z"
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          example:
            - id: 1
              name: "work"
              color: "#FF5733"
            - id: 2
              name: "urgent"
              color: "#C70039"

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Complete project documentation"
        description:
          type: string
          maxLength: 5000
          nullable: true
          example: "Write comprehensive API documentation"
        priority:
          type: string
          enum: [low, medium, high]
          nullable: true
          example: "high"
        due_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-15T10:00:00Z"
        is_recurring:
          type: boolean
          default: false
          example: false
        recurrence_rule:
          type: string
          enum: [daily, weekly, monthly]
          nullable: true
          example: null
        tag_ids:
          type: array
          items:
            type: integer
          maxItems: 10
          example: [1, 2]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        is_recurring:
          type: boolean
        recurrence_rule:
          type: string
          enum: [daily, weekly, monthly]
          nullable: true
        tag_ids:
          type: array
          items:
            type: integer
          maxItems: 10

    Tag:
      type: object
      required:
        - id
        - name
        - user_id
        - created_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "work"
        user_id:
          type: string
          example: "user_abc123"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          example: "#FF5733"
        created_at:
          type: string
          format: date-time
          example: "2026-02-09T08:30:00Z"
        task_count:
          type: integer
          description: Number of tasks with this tag (computed field)
          example: 5

    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z0-9 _-]+$'
          example: "work"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          example: "#FF5733"

    TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z0-9 _-]+$'
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true

    Reminder:
      type: object
      required:
        - id
        - task_id
        - user_id
        - remind_at
        - status
        - created_at
      properties:
        id:
          type: integer
          example: 789
        task_id:
          type: integer
          example: 123
        user_id:
          type: string
          example: "user_abc123"
        remind_at:
          type: string
          format: date-time
          example: "2026-02-14T10:00:00Z"
        status:
          type: string
          enum: [pending, sent, failed]
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2026-02-09T08:30:00Z"
        sent_at:
          type: string
          format: date-time
          nullable: true
          example: null
        task:
          $ref: '#/components/schemas/Task'

    ReminderCreate:
      type: object
      required:
        - task_id
        - remind_at
      properties:
        task_id:
          type: integer
          example: 123
        remind_at:
          type: string
          format: date-time
          example: "2026-02-14T10:00:00Z"

    ActivityLog:
      type: object
      required:
        - id
        - user_id
        - action
        - timestamp
      properties:
        id:
          type: integer
          example: 1001
        task_id:
          type: integer
          nullable: true
          example: 123
        user_id:
          type: string
          example: "user_abc123"
        action:
          type: string
          enum: [task_created, task_updated, task_completed, task_deleted, tag_added, tag_removed, reminder_set, reminder_sent]
          example: "task_created"
        details:
          type: object
          nullable: true
          example:
            title: "Complete project documentation"
            priority: "high"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-09T08:30:00Z"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "ValidationError"
        message:
          type: string
          example: "Invalid input data"
        details:
          type: object
          nullable: true
          example:
            field: "priority"
            issue: "must be one of: low, medium, high"

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
