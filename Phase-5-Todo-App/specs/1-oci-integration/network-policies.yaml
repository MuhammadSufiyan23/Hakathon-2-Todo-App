---
# Network Policy to restrict traffic to the backend service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: todo-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: todo-frontend
    - podSelector:
        matchLabels:
          app: notification-service
    - podSelector:
        matchLabels:
          app: scheduler-service
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to: []  # Allow all external traffic (DNS, internet, etc.)

---
# Network Policy to restrict traffic to the frontend service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: todo-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow traffic from ingress controller
    - podSelector:
        matchLabels:
          app: dapr-operator  # Allow traffic from Dapr operator
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: todo-backend
    ports:
    - protocol: TCP
      port: 8000

---
# Network Policy for the notification service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: todo-backend
    - podSelector:
        matchLabels:
          app: scheduler-service
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []  # Allow all external traffic (email, push notifications, etc.)

---
# Network Policy for the scheduler service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduler-service-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: scheduler-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: todo-backend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: todo-backend
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - protocol: TCP
      port: 8080

---
# Network Policy for database services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: todo-backend
    - podSelector:
        matchLabels:
          app: dapr-placement  # Allow Dapr placement service to access the state store
    ports:
    - protocol: TCP
      port: 5432

---
# Network Policy for Redis (if used for caching/session storage)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: todo-backend
    ports:
    - protocol: TCP
      port: 6379

---
# Network Policy for Dapr system components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dapr-system-policy
  namespace: dapr-system
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
      podSelector:
        matchLabels:
          dapr.io(sidecar-injection): "enabled"
    ports:
    - protocol: TCP
      port: 3500  # Dapr sidecar HTTP endpoint
    - protocol: TCP
      port: 50001  # Dapr sidecar gRPC endpoint
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: default
    ports:
    - protocol: TCP
      port: 8000  # Backend service
      port: 3000  # Frontend service
      port: 8080  # Notification/Scheduler services
    - protocol: TCP
      port: 5432  # PostgreSQL
      port: 6379  # Redis

---
# Default deny-all policy (applies to pods without other policies)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
# Allow DNS resolution from all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53